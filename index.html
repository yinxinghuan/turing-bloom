<!doctype html>
<html lang="zh">
  <head>
    <meta name="game-uuid" content="1c7c7b79-583d-4b6f-b325-a6699c613a4d" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <title>Turing Bloom</title>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <main class="tb" id="app">
      <canvas class="tb__canvas" id="field" aria-label="可触摸的反应扩散生长场"></canvas>

      <header class="tb__title" aria-label="Turing Bloom">
        <span>REACTION STUDY / 01</span>
        <h1>TURING<br />BLOOM</h1>
      </header>

      <div class="tb__hud" aria-live="polite">
        <span class="tb__timer" id="maturity">00</span>
        <span class="tb__timer-unit">% MATURE</span>
      </div>

      <button class="tb__reset" id="reset" type="button" aria-label="重新开始">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
      </button>

      <p class="tb__hidden-gesture" id="gesture">双指移动 · 缩放参数空间</p>

      <div class="tb__demo" id="demo" aria-hidden="true">
        <span class="tb__demo-trail"></span>
        <span class="tb__demo-finger">
          <svg viewBox="0 0 24 24"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.92-1.38z"/></svg>
        </span>
      </div>

      <section class="tb__result" id="result" hidden>
        <p>SPECIMEN MATURED</p>
        <h2 id="result-species">CORAL</h2>
        <span id="result-detail">05 ZONES / STABLE</span>
        <button type="button" id="again">再培养一次</button>
      </section>

      <footer class="tb__credit">
        <span>Original simulation: Amanda Ghassaei / gpu-io</span>
        <img src="./alteru.svg" alt="" aria-hidden="true" draggable="false" />
      </footer>

      <div class="tb__error" id="error" hidden>
        <p>这台设备暂时无法培养这片纹样</p>
        <button type="button" id="retry">重试</button>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
